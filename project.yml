name: LectureBuddy
options:
  bundleIdPrefix: com.lecturebuddy
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  LectureBuddy:
    type: application
    platform: iOS
    sources:
      - path: LectureBuddy.swiftpm/Sources
    info:
      path: CI/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lecturebuddy.app
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: CI/Info.plist
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"