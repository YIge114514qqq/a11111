name: LectureBuddy
options:
  bundleIdPrefix: com.lecturebuddy
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  LectureBuddy:
    type: application
    platform: iOS
    sources:
      - path: LectureBuddy.swiftpm/Sources
    # 注意：不要写 info.path —— XcodeGen 会用它重写该 plist，
    # 把 UILaunchScreen / 麦克风权限说明冲掉（会导致上下黑边 + 录音闪退）。
    # 只用下面 settings 里的 INFOPLIST_FILE 指过来即可。
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lecturebuddy.app
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: CI/Info.plist
        CODE_SIGN_STYLE: Automatic