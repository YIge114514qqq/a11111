name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Run deterministic model tests
        run: |
          set -euo pipefail
          mkdir -p build-tests
          swiftc LectureBuddy.swiftpm/Sources/Models.swift CI/Tests/main.swift -o build-tests/model-tests
          build-tests/model-tests

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate
          echo "--- 生成结果 ---"
          ls -la LectureBuddy.xcodeproj
          echo "--- 源文件数 ---"
          find LectureBuddy.swiftpm/Sources -name '*.swift' | wc -l
          echo "--- Info.plist ---"
          ls -la CI/Info.plist

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project LectureBuddy.xcodeproj \
            -target LectureBuddy \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            OBJROOT="$PWD/build/obj" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build
      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project LectureBuddy.xcodeproj \
            -target LectureBuddy \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro Max' \
            SYMROOT="$PWD/build-sim" \
            OBJROOT="$PWD/build-sim/obj" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Run in simulator and screenshot
        run: |
          set -euxo pipefail
          APP="$PWD/build-sim/Debug-iphonesimulator/LectureBuddy.app"
          test -d "$APP" || { echo "模拟器 app 未生成"; find build-sim -name '*.app'; exit 1; }

          DEV=$(xcrun simctl list devices available | grep -m1 'iPhone 16 Pro Max' | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          echo "device=$DEV"
          xcrun simctl boot "$DEV" || true
          xcrun simctl bootstatus "$DEV" -b

          xcrun simctl install "$DEV" "$APP"
          xcrun simctl launch "$DEV" com.lecturebuddy.app
          sleep 6

          xcrun simctl io "$DEV" screenshot /tmp/shot1.png
          cp /tmp/shot1.png "$PWD/sim-screenshot-1.png" || true

          # 截图仅供人工检查布局；没有窗口日志不能证明没有兼容模式。
          xcrun simctl spawn "$DEV" launchctl list > /tmp/app-processes.txt
          awk '$1 ~ /^[0-9]+$/ && /com\.lecturebuddy\.app/ { found=1 } END { exit !found }' /tmp/app-processes.txt \
            || { echo "ERROR: App 进程已退出"; exit 1; }

      - name: Smoke test - debug autostart and process survival
        run: |
          set -euxo pipefail
          DEV=$(xcrun simctl list devices available | grep -m1 'iPhone 16 Pro Max' | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          # 预置权限，否则自动化会被系统弹窗拦住，测不到录音逻辑。
          xcrun simctl privacy "$DEV" grant microphone com.lecturebuddy.app || true
          xcrun simctl privacy "$DEV" grant speech-recognition com.lecturebuddy.app || true

          # 假 Key 仅用于启动/存活冒烟检查，不验证录音状态或远端服务。
          # 假 Key 必被服务端拒绝，所以不用真凭据也不会泄露。
          DATA=$(xcrun simctl get_app_container "$DEV" com.lecturebuddy.app data)
          PLIST="$DATA/Library/Preferences/com.lecturebuddy.app.plist"
          mkdir -p "$(dirname "$PLIST")"
          /usr/libexec/PlistBuddy -c "Add :dashscopeKey string sk-test-0000" "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Set :dashscopeKey sk-test-0000" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :dashscopeURL string https://dashscope.aliyuncs.com/api/v1" "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Set :dashscopeURL https://dashscope.aliyuncs.com/api/v1" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :asrModel string qwen3.5-livetranslate-flash-realtime" "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Set :asrModel qwen3.5-livetranslate-flash-realtime" "$PLIST"
          cat "$PLIST" || true

          xcrun simctl terminate "$DEV" com.lecturebuddy.app || true
          # -autostart 是仅用于自动化的调试开关：App 启动后自己点一次“开始记录”
          xcrun simctl launch "$DEV" com.lecturebuddy.app -autostart YES
          # 留出启动时间；存活并不代表音频采集或握手成功。
          sleep 12

          xcrun simctl io "$DEV" screenshot /tmp/rec.png
          cp /tmp/rec.png "$PWD/sim-screenshot-recording.png" || true
          echo "--- 启动 12 秒后的截图已抓 ---"

          xcrun simctl spawn "$DEV" log show --last 30s --predicate 'process == "LectureBuddy"' > /tmp/rec.log 2>&1 || true
          grep -iE 'error|websocket|dashscope|status' /tmp/rec.log | tail -40 || true

          echo "--- 检查 App 是否仍在运行 ---"
          xcrun simctl spawn "$DEV" launchctl list > /tmp/record-processes.txt
          awk '$1 ~ /^[0-9]+$/ && /com\.lecturebuddy\.app/ { found=1 } END { exit !found }' /tmp/record-processes.txt \
            || { echo "ERROR: App 进程已退出"; exit 1; }

          echo "OK: App 启动后仍在运行。日志和截图仅供诊断；未验证音频采集、录音状态或服务连接。"



      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-screenshots
          path: |
            sim-screenshot-*.png
          retention-days: 14
      - name: Verify Info.plist in built app
        run: |
          PLIST="$PWD/build/Release-iphoneos/LectureBuddy.app/Info.plist"
          test -f "$PLIST" || { echo "找不到打包后的 Info.plist"; exit 1; }
          echo "--- 包内 Info.plist 关键项 ---"
          /usr/libexec/PlistBuddy -c "Print :NSMicrophoneUsageDescription" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Print :UILaunchScreen" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$PLIST" || true
          # 缺任何一个都会在真机上出问题：没有麦克风说明 → 点录音闪退；
          # 没有 UILaunchScreen → iOS 按旧尺寸渲染，界面上下黑边。
          /usr/bin/plutil -extract NSMicrophoneUsageDescription raw "$PLIST" > /dev/null \
            || { echo "ERROR: 缺 NSMicrophoneUsageDescription，点录音会闪退"; exit 1; }
          /usr/libexec/PlistBuddy -c "Print :UILaunchScreen" "$PLIST" > /dev/null \
            || { echo "ERROR: 缺 UILaunchScreen，界面会上下黑边"; exit 1; }
          # 文件共享关掉的话，用户就看不到沙盒里的 lessons.json 和录音，
          # 换 ipa / 删 App 前没法自己把数据拷出来。
          /usr/bin/plutil -extract UIFileSharingEnabled raw "$PLIST" > /dev/null \
            || { echo "ERROR: 缺 UIFileSharingEnabled，用户无法从「文件」App 取回数据"; exit 1; }
          /usr/bin/plutil -extract LSSupportsOpeningDocumentsInPlace raw "$PLIST" > /dev/null \
            || { echo "ERROR: 缺 LSSupportsOpeningDocumentsInPlace"; exit 1; }
          echo "OK: plist 关键项齐全"

      - name: Package unsigned IPA
        run: |
          APP_PATH="$PWD/build/Release-iphoneos/LectureBuddy.app"
          test -d "$APP_PATH" || { echo "app not found"; find build -maxdepth 3 -name "*.app"; exit 1; }
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          /usr/bin/zip -qry LectureBuddy-unsigned.ipa Payload
          du -h LectureBuddy-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: LectureBuddy-unsigned-ipa
          path: LectureBuddy-unsigned.ipa
          retention-days: 14