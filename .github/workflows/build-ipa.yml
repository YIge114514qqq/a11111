name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project LectureBuddy.xcodeproj \
            -target LectureBuddy \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            OBJROOT="$PWD/build/obj" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build

      - name: Package unsigned IPA
        run: |
          APP_PATH="$PWD/build/Release-iphoneos/LectureBuddy.app"
          test -d "$APP_PATH" || { echo "app not found"; find build -maxdepth 3 -name "*.app"; exit 1; }
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          /usr/bin/zip -qry LectureBuddy-unsigned.ipa Payload
          du -h LectureBuddy-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: LectureBuddy-unsigned-ipa
          path: LectureBuddy-unsigned.ipa
          retention-days: 14